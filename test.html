<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Database schema</title>
    <style>
      :root {
        --bg: #fff;
        --fg: #1f2328;
        --muted: #656d76;
        --line: #c9d1d9;
        --head: #e8eef6;
        --headv: #efe9f8;
        --edge: #6e7781;
        --key: #9a6700;
        --card: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #8b949e;
          --line: #3d444d;
          --head: #1c2633;
          --headv: #2a2238;
          --edge: #8b949e;
          --key: #d29922;
          --card: #151b23;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 2px;
      }
      header p,
      footer {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      main {
        margin: 12px 0;
        overflow: auto;
      }
      svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      svg text {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        fill: var(--fg);
      }
      .c {
        fill: var(--card);
        stroke: none;
      }
      .o {
        fill: none;
        stroke: var(--line);
      }
      .h {
        fill: var(--head);
      }
      .v .h {
        fill: var(--headv);
      }
      .hn {
        font-weight: 600;
      }
      .k {
        fill: var(--key);
        font-size: 10px;
        font-weight: 600;
      }
      .ty {
        fill: var(--muted);
      }
      .nl {
        opacity: 0.62;
      }
      .pk {
        font-weight: 600;
      }
      .p .o {
        stroke-dasharray: 4 3;
      }
      .p .hn {
        font-style: italic;
        font-weight: 400;
        fill: var(--muted);
      }
      .e {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.25;
      }
      .ev {
        stroke-dasharray: 2 3;
        opacity: 0.8;
      }
      .m {
        fill: var(--edge);
      }
      details {
        margin-top: 8px;
        font-size: 13px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      details ul {
        margin: 6px 0;
        padding-left: 20px;
      }
      code {
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }
    </style>
  </head>
